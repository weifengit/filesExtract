# 打包 workflow：在 GitHub Actions 上完成构建/测试/打包，不在本地打包
#
# 触发方式：
#   - 推送到 main            → 测试 + 构建 + 三端打包（Windows exe / macOS dmg / Linux AppImage+deb，artifact）
#   - 打 tag（如 v0.2.0）     → 同上 + 自动创建 GitHub Release（附带三端安装包）
#   - workflow_dispatch      → 手动在 Actions 页面触发
name: Build & Package

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # 质量门禁：测试 + 类型检查 + 前端构建（产物由 tauri job 打进 exe，不单独上传）
  build:
    name: Test & Type-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12

      # 必须 >=22：pdfjs-dist 4.10.38 使用了 Promise.withResolvers（Node 22 才支持）
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Type-check & build
        run: pnpm build

  # 三端矩阵打包：Windows(NSIS exe) / macOS(dmg) / Linux(AppImage + deb)，本地不打包
  tauri:
    name: Build ${{ matrix.platform }} (Tauri)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
            args: --bundles nsis
            artifact-path: src-tauri/target/release/bundle/nsis/*.exe
          # macos-latest 为 Apple Silicon(arm64)；如需 Intel 包可加 macos-13
          - platform: macos
            os: macos-latest
            args: --bundles dmg
            artifact-path: src-tauri/target/release/bundle/dmg/*.dmg
          - platform: linux
            os: ubuntu-latest
            args: --bundles appimage,deb
            artifact-path: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Tauri Linux 构建依赖（WebKitGTK 等）
      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # tauri-action 自动执行 beforeBuildCommand（pnpm build）并编译 Rust + 打包
      # 不传 GITHUB_TOKEN：只构建不建 Release（Release 由下方 release job 统一创建）
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        with:
          args: ${{ matrix.args }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: filesextract-${{ matrix.platform }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error

  # 仅在推送 v* 标签时执行：发布 GitHub Release（附带三端安装包）
  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, tauri]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # gh release create --generate-notes 需要 git 仓库上下文
      - name: Checkout
        uses: actions/checkout@v7

      # 把三端产物（filesextract-windows / macos / linux）合并下载到同一目录
      - name: Download all installer artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: filesextract-*
          path: installers/
          merge-multiple: true

      # Linux 多路径上传会保留 appimage/ deb/ 子目录，扁平化到 installers/ 根并删掉空目录
      - name: Flatten installer directory
        run: |
          find installers -mindepth 2 -type f -exec mv -t installers {} +
          find installers -mindepth 1 -type d -empty -delete
          ls -la installers/

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" installers/* --generate-notes
