# 打包 workflow：在 GitHub Actions 上完成构建/测试/打包，不在本地打包
#
# 触发方式：
#   - 推送到 main            → 构建 + 上传 dist 产物（artifact）
#   - 打 tag（如 v0.1.0）     → 构建 + 上传 artifact + 自动创建 GitHub Release（附带 zip）
#   - workflow_dispatch      → 手动在 Actions 页面触发
name: Build & Package

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build & Upload artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      # 必须 >=22：pdfjs-dist 4.10.38 使用了 Promise.withResolvers（Node 22 才支持）
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Type-check & build
        run: pnpm build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: filesextract-dist
          path: dist/
          if-no-files-found: error

  # 仅在推送 v* 标签时执行：把构建产物打成 zip 并发布为 GitHub Release
  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: filesextract-dist
          path: dist/

      - name: Package zip
        run: |
          cd dist
          zip -r ../filesextract-${{ github.ref_name }}.zip .
          cd ..

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" filesextract-*.zip --generate-notes
