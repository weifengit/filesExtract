# 打包 workflow：在 GitHub Actions 上完成构建/测试/打包，不在本地打包
#
# 触发方式：
#   - 推送到 main            → 测试 + 构建 + 打包 Windows exe（artifact）
#   - 打 tag（如 v0.1.0）     → 同上 + 自动创建 GitHub Release（附带 exe 安装包）
#   - workflow_dispatch      → 手动在 Actions 页面触发
name: Build & Package

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # 质量门禁：测试 + 类型检查 + 前端构建（产物由 tauri job 打进 exe，不单独上传）
  build:
    name: Test & Type-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12

      # 必须 >=22：pdfjs-dist 4.10.38 使用了 Promise.withResolvers（Node 22 才支持）
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Type-check & build
        run: pnpm build

  # 在 Windows runner 上用 Tauri 打包 exe（NSIS 安装包），本地不打包
  tauri:
    name: Build Windows exe (Tauri)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # tauri-action 自动执行 beforeBuildCommand（pnpm build）并编译 Rust + 打 NSIS 包
      # 不传 GITHUB_TOKEN：只构建不建 Release（Release 由下方 release job 统一创建）
      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0

      - name: Upload NSIS installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: filesextract-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

  # 仅在推送 v* 标签时执行：发布 GitHub Release（附带 exe 安装包）
  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, tauri]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download NSIS installer artifact
        uses: actions/download-artifact@v8
        with:
          name: filesextract-nsis
          path: nsis/

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" nsis/*.exe --generate-notes
